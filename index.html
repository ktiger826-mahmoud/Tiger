a.btn.primary{background:linear-gradient(135deg,#e2c47e,#a7803d);color:#17130c;border:0}
a.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
.icon{font-size:19px}.phones{display:grid;grid-template-columns:1fr 1fr;gap:10px}
footer{text-align:center;color:#827d72;font-size:12px;padding:0 15px 20px}
